# Accept MQTT connections on port 1883 from other Docker containers.
listener 1883 0.0.0.0

# Authentication is intentionally disabled for local development.
# Production deployment will require authenticated and encrypted connections.
allow_anonymous true

# Milestone 2 uses Mosquitto only as a transport layer.
# Broker persistence will be addressed if later requirements need it.
persistence false

# Write broker logs to the Docker container output.
log_dest stdout

# Record relevant broker and client lifecycle events.
log_type error
log_type warning
log_type notice
log_type information

connection_messages true